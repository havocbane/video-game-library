[package]
name = "video-game-library"
version = "0.1.0"
edition = "2024"
description = "A carousel-style video game library and backlog tracker with Backloggery sync"

[build-dependencies]
tauri-build = "2"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls", "http2", "charset", "system-proxy"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"
thiserror = "2.0.21"

[profile.release]
codegen-units = 1
lto = true
strip = true
