[package]
name = "video-game-library"
version = "0.2.0"
edition = "2024"
description = "A carousel-style video game library and backlog tracker with Backloggery sync"
license = "GPL-3.0-or-later"
repository = "https://github.com/havocbane/video-game-library"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
csv = "1.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls", "http2", "charset", "system-proxy", "form"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
